<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NestSignal – Einladung annehmen</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="card">

      <div class="logo-circle">
        <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M30 10C22.268 10 16 16.268 16 24C16 31.732 22.268 38 30 38C33.5 38 36.7 36.68 39.14 34.5C37.1 35.14 34.9 35.2 32.7 34.5C26.4 32.5 22.5 26.4 23.5 19.9C24.2 15.3 27.1 11.6 30 10Z" fill="white"/>
          <path d="M40 8 L41 11 L44 12 L41 13 L40 16 L39 13 L36 12 L39 11 Z" fill="white"/>
          <circle cx="45" cy="20" r="1.5" fill="white"/>
        </svg>
      </div>

      <h1 class="app-name">NestSignal</h1>
      <p class="tagline" id="inviteTagline">Einladung wird geladen…</p>

      <form id="inviteForm" style="display:none;">
        <div class="field-group">
          <label for="firstName">Vorname</label>
          <input type="text" id="firstName" placeholder="Dein Vorname" required />
        </div>

        <div class="field-group">
          <label for="email">E-Mail</label>
          <input type="email" id="email" placeholder="du@beispiel.ch" required readonly />
        </div>

        <div class="field-group">
          <label for="password">Passwort</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>

        <div class="field-group">
          <label for="confirmPassword">Passwort bestätigen</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" required />
        </div>

        <div class="error-msg" id="errorMsg" role="alert"></div>

        <button type="submit" class="btn-register">Konto erstellen & beitreten</button>
      </form>

      <div id="invalidMsg" style="display:none; text-align:center;">
        <p style="color:#b94a3a; font-size:16px;">Diese Einladung ist ungültig oder bereits verwendet.</p>
        <a href="login.html" style="color:#5aabe0;">Zum Login</a>
      </div>

    </div>

    <script src="js/invite.js"></script>
  </body>
</html>
