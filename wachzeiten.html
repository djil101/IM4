    <title>NestSignal – Wachzeiten</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="dashboard-page wachzeiten-page">

    <div class="dashboard">

      <!-- Header -->
      <div class="page-header">
        <h1 class="page-title">Wachzeiten</h1>
        <p class="page-sub">Erkannte Wachereignisse der letzten Tage</p>
      </div>

      <!-- Weekly Card -->
      <div class="weekly-card">
        <p class="weekly-label">Diese Woche</p>
        <p class="weekly-sublabel">Erste Wachzeit pro Tag</p>
        <div class="week-grid">
          <!-- wird per JS befüllt -->
        </div>
      </div>

      <!-- Stats -->
      <div class="stat-grid">
        <div class="stat-card">
          <p class="stat-value">–</p>
          <p class="stat-label">Ø erste Wachzeit</p>
        </div>
        <div class="stat-card">
          <p class="stat-value">–</p>
          <p class="stat-label">Häufigster Auslöser</p>
        </div>
      </div>

      <!-- Event-Cards werden per JS eingefügt -->

    </div>
