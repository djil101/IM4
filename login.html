<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NestSignal – Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="card">
      <!-- Logo -->
      <div class="logo-circle">
        <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Crescent moon -->
          <path d="M30 10C22.268 10 16 16.268 16 24C16 31.732 22.268 38 30 38C33.5 38 36.7 36.68 39.14 34.5C37.1 35.14 34.9 35.2 32.7 34.5C26.4 32.5 22.5 26.4 23.5 19.9C24.2 15.3 27.1 11.6 30 10Z" fill="white"/>
          <!-- Sparkle top-right -->
          <path d="M40 8 L41 11 L44 12 L41 13 L40 16 L39 13 L36 12 L39 11 Z" fill="white"/>
          <!-- Small sparkle dot -->
          <circle cx="45" cy="20" r="1.5" fill="white"/>
        </svg>
      </div>

      <h1 class="app-name">NestSignal</h1>
      <p class="tagline">Ruhig im Nest. Sicher informiert.</p>

      <form id="loginForm">
        <div class="field-group">
          <label for="email">E-Mail</label>
          <input type="email" id="email" placeholder="du@beispiel.ch" required />
        </div>

        <div class="field-group">
          <label for="password">Passwort</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>

        <a href="#" class="forgot-link">Passwort vergessen?</a>

        <button type="submit" class="btn-login">Einloggen</button>
      </form>

      <p class="bottom-link">Noch kein Konto? <a href="register.html">Konto erstellen</a></p>
    </div>

    <script src="js/login.js"></script>
  </body>
</html>
